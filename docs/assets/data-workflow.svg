<title id="title">Data analysis workflow</title><desc id="desc">Camera CSVs and the Pi log feed synchronized tables. Annotations and spatial observations define lane paths. Lane paths and OBD speed produce a reference and GPS errors for autocorrelation analysis.</desc>
